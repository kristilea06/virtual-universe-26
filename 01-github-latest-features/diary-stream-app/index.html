<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Diary Stream</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Private journal</p>
          <h1>My Diary Stream</h1>
        </div>
        <div class="owner-pill">Owner: You</div>
      </header>

      <main class="content">
        <section class="composer-panel">
          <div class="section-header">
            <h2>New diary entry</h2>
            <span class="tag">Owner only</span>
          </div>

          <form id="entryForm" class="entry-form">
            <label>
              Entry title
              <input id="entryTitle" name="entryTitle" type="text" maxlength="80" placeholder="What happened today?" required />
            </label>

            <label>
              Your thoughts
              <textarea id="entryContent" name="entryContent" rows="6" maxlength="1200" placeholder="Write about your day..." required></textarea>
            </label>

            <button type="submit">Post to the stream</button>
          </form>
        </section>

        <section class="stream-panel">
          <div class="section-header">
            <h2>Community stream</h2>
            <span class="tag soft">Viewable by others</span>
          </div>
          <div id="entryList" class="entry-list" aria-live="polite"></div>
        </section>
      </main>
    </div>

    <template id="entryTemplate">
      <article class="entry-card">
        <div class="entry-meta">
          <div>
            <p class="entry-author"></p>
            <p class="entry-date"></p>
          </div>
          <span class="entry-title-badge">Entry</span>
        </div>
        <h3 class="entry-title"></h3>
        <p class="entry-text"></p>

        <div class="comments-block">
          <h4>Comments</h4>
          <ul class="comments-list"></ul>

          <form class="comment-form">
            <input class="commenter-name" type="text" maxlength="40" placeholder="Your name" required />
            <textarea class="comment-text" rows="2" maxlength="400" placeholder="Leave a comment..." required></textarea>
            <button type="submit">Comment</button>
          </form>
        </div>
      </article>
    </template>

    <script src="script.js"></script>
  </body>
</html>
